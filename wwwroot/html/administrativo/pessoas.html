<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pessoas</title>
    <link rel="stylesheet" href="../../css/site.css">
    <script src="../../js/api/pessoa.js" defer></script>
</head>
<body onload="alterarTabela()">
    <header>
        <button onclick="javascript:history.back()">← Voltar</button>
    </header>
    <br>
    <main>
        <div>
            <h1>Adicionar Pessoas</h1>
            <label for="nome">Nome</label>
            <input type="text" name="nome" id="nome">
            <br>
            <label for="idade">Idade</label>
            <input type="number" name="idade" id="idade">
            <br>
            <label for="cpf">CPF</label>
            <input type="text" name="cpf" id="cpf">
            <br>
            <label for="email">E-mail</label>
            <input type="email" name="email" id="email">
            <br>
            <label for="tipoUsuario">Tipo do usuario</label>
            <select name="tipoUsuario" id="tipoUsuario" onchange="alterarDiv()">
                <option value="null" disabled selected>Selecione o tipo do usuario</option>
                <option value="Professor">Professor</option>
                <option value="Administrador">Administrativo</option>
            </select>
            <div style="display:none;border: none;" id="professor-div">
                <label for="formacoes">Formações</label>
                <input type="text" name="formacoes" id="formacoes">
                <br>
                <label for="cargo">Cargo</label>
                <input type="text" name="cargo" id="cargo">
            </div>
            <div style="display:none;border: none;" id="administrador-div"></div>
            <br>
            <button class="cadastrar" onclick="adicionarPessoa(); alterarTabela()">Adicionar</button>
        </div>
        <br>
        <div>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Idade</th>
                        <th>CPF</th>
                        <th>E-mail</th>
                        <th>Tipo do Usuario</th>
                        <th></th>
                        <th></th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="tabela-pessoas">
    
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
