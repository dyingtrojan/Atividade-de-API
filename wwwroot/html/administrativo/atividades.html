<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividades</title>
    <link rel="stylesheet" href="../../css/site.css">
    <script src="../../js/api/atividade.js" defer></script>
</head>

<body onload="alterarTabela(); procurarTurmas(); procurarDisciplinas(); procurarProfessor()">
    <header>
        <button onclick="javascript:history.back()">← Voltar</button>
    </header>
    <br>
    <main>
        <div>
            <h1>Adicionar atividades</h1>
            <label for="nome">Nome</label>
            <input type="text" name="nome" id="nome">
            <br>
            <label for="descricao">Descrição</label>
            <br>
            <textarea name="descricao" id="descricao" rows="15" cols="45"></textarea>
            <br>
            <label for="turma">Turma</label>
            <select name="turma" id="turma">
                <option value="null" disabled selected>Selecione a turma</option>
            </select>
            <br>
            <label for="professor">Professor</label>
            <select name="professor" id="professor">
                <option value="null" disabled selected>Selecione o professor</option>

            </select>
            <br>
            <label for="disciplina">Disciplina</label>
            <select name="disciplina" id="disciplina">
                <option value="null" disabled selected>Selecione a disciplina</option>
            </select>
            <br>
            <button class="cadastrar" onclick="adicionarAtividade()">Adicionar</button>
        </div>
        <br>
        <div>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Descricao</th>
                        <th>Turma</th>
                        <th>Professor</th>
                        <th></th>
                        <th></th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="tabela-atividades">

                </tbody>
            </table>
        </div>
    </main>
</body>

</html>
